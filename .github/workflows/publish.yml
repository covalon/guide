# Publishes the site to GitHub Pages whenever the vault is pushed to the main branch.
# (Settings → Pages → Source: "GitHub Actions" in the repository on GitHub.)
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, for the sitemap's "last changed" dates
          lfs: true   # the pictures in 🖼️ Assets are stored with Git LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # keeps the downloaded Python packages between runs
          cache-dependency-path: .site-build/requirements.txt
      # the callout icons and the made-smaller pictures, kept between runs so only new or changed
      # pictures are processed (each run saves a fresh copy; the newest one is restored)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/covalon-site
          key: covalon-site-${{ github.run_id }}
          restore-keys: covalon-site-
      - name: Install the build's Python packages
        run: pip install -r .site-build/requirements.txt
      - name: Build the site
        run: python .site-build/build.py . public
      # the headless browser that photographs the tables for the link previews (kept between runs)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('.site-build/requirements.txt') }}
      - name: Install the headless browser
        run: python -m playwright install --with-deps chromium
      - name: Take the tables' preview pictures
        run: python .site-build/previews.py public
      - name: Build the search index
        run: python -m pagefind --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: ${{ !startsWith(github.event.head_commit.message, 'DRAFT') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' &&  !startsWith(github.event.head_commit.message, 'QUICKFIX') }}
    runs-on: ubuntu-latest
    steps:
    # Posts directly to the Discord webhook (instead of using an action) so the
    # embed title is plain text with no link back to the GitHub release.
    - name: Post Commit to Discord
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        MESSAGE: ${{ github.event.head_commit.message }}
        TIME: ${{ github.event.head_commit.timestamp }}
      run: |
        python3 <<'PYEOF'
        import json
        import os
        import urllib.request
        from datetime import datetime

        release_date = datetime.fromisoformat(os.environ["TIME"].replace("Z", "+00:00"))
        date_str = f'{release_date:%b} {release_date.day} {release_date:%Y}'
        title = f'Covalon Guide ({date_str})'

        payload = {
            "username": "Covalon Guide Changelog",
            "avatar_url": "https://cdn.discordapp.com/avatars/1076881817472335982/ef4c79ed8b79adf4b67d6089420f6726.webp",
            "embeds": [
                {
                    "title": title,
                    "url": "https://covalon.github.io/guide/",
                    "description": os.environ["MESSAGE"][:4096],
                    "color": 12886888,
                }
            ],
        }

        req = urllib.request.Request(
            os.environ["WEBHOOK_URL"],
            data=json.dumps(payload).encode("utf-8"),
            headers={
                "Content-Type": "application/json",
                "User-Agent": "Mozilla/5.0 (compatible; CovalonReleaseBot/1.0)",
            },
            method="POST",
        )
        try:
            with urllib.request.urlopen(req) as resp:
                print(f"Discord webhook responded with status {resp.status}")
        except urllib.error.HTTPError as err:
            print(f"Discord webhook error {err.code}: {err.read().decode('utf-8', 'replace')}")
            raise
        PYEOF